name: kimsuky IoC

on:
  push:
    paths:
      - '.github/workflows/manual.yml'  # 워크플로 파일이 수정되면 실행
  schedule:
    - cron: '00 19 * * *'
  workflow_dispatch:  # 수동 실행 가능

permissions:
  contents: write

jobs:
  collect-and-process:
    runs-on: ubuntu-latest

    steps:
    - name: 리포지토리 체크아웃
      uses: actions/checkout@v4

    - name: Python 환경 설정
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: 의존성 패키지 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: 비공개 저장소에서 파이썬 코드 가져오기
      run: |
        git clone https://x-access-token:${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/NCITSSEC/kimsuky_code.git --depth=1
        cp kimsuky_code/kimsuky-automation.py .
      env:
        GITHUB_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}

    # ◀ 여기에 id: kimsuky_step 이 추가되었습니다!
    - name: kimsuky IoC 데이터 수집 및 변환
      id: kimsuky_step
      run: python kimsuky-automation.py

    - name: 변경 사항 확인
      run: |
        git diff --quiet || echo "Changes detected"

    - name: 변경된 데이터 GitHub에 푸시
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"
        git add data/Kimsuky_IoC.txt
        git commit -m "자동 업데이트: Kimsuky IOC 데이터 갱신" || exit 0
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: 실행 결과 이메일 발송
      if: always()  # 성공/실패 여부와 상관없이 항상 메일 발송
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        secure: true
        username: ${{ secrets.MAIL_USERNAME }}
        password: ${{ secrets.MAIL_PASSWORD }}
        subject: "[GitHub Actions] Kimsuky IoC 수집 결과 보고"
        to: lwh3632@ncits.co.kr,jane00@ncits.co.kr
        from: "Kimsuky IoC Bot <${{ secrets.MAIL_USERNAME }}>"
        body: |
          Kimsuky IoC 수집 작업이 완료되었습니다.
          
          - 결과 요약: ${{ steps.kimsuky_step.outputs.summary }}
          - 추가된 건수: ${{ steps.kimsuky_step.outputs.count }}건
          - 작업 상세 링크: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
